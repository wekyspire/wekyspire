<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>房型陈列页</title>
    <script>
      window.__errs = [];
      window.__ready = false;
      window.addEventListener('error', (e) => {
        window.__errs.push(e.message + ' @ ' + e.filename + ':' + e.lineno);
        document.title = 'ERR#' + window.__errs.length;
      });
      window.addEventListener('unhandledrejection', (e) => {
        window.__errs.push('PROMISE:' + ((e.reason && e.reason.stack) || e.reason));
      });
    </script>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: #07090f; }
      #room-canvas { display: block; }
      #room-overlay {
        position: fixed; top: 10px; left: 12px; pointer-events: none;
        font: 13px/1.7 monospace; color: #cfd8e3;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }
      #room-overlay h1 { margin: 0 0 2px; font: 600 15px/1.4 monospace; color: #e8eef8; }
      #room-overlay select, #room-overlay input, #room-overlay button {
        pointer-events: auto; margin-top: 4px; background: #10141f; color: #cfd8e3;
        border: 1px solid #3a465c; border-radius: 4px; padding: 2px 6px; font: 12px monospace;
      }
    </style>
  </head>
  <body>
    <div id="room-overlay">
      <h1>房型陈列页 · roomGallery</h1>
      <div id="room-info"></div>
      <div>配方：
        <select id="recipe-select"></select>
        种子：<input id="seed-input" size="10" />
        <button id="rebuild">重建</button>
      </div>
      <div>拖拽旋转 ｜ 滚轮缩放 ｜ 相机默认取战斗机位（fov24 斜视）</div>
    </div>
    <script type="module" src="/src/debug/roomGallery.js"></script>
  </body>
</html>
