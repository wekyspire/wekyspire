<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魏启尖塔</title>
    <script>
      window.__errs = [];
      window.addEventListener('error', (e) => {
        window.__errs.push(e.message + ' @ ' + e.filename + ':' + e.lineno);
        document.title = 'ERR#' + window.__errs.length;
      });
      window.addEventListener('unhandledrejection', (e) => {
        window.__errs.push('PROMISE:' + ((e.reason && e.reason.stack) || e.reason));
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/shell/main.js"></script>
  </body>
</html>
