    <script>
      window.__errs = [];
      window.addEventListener('error', (e) => {
        window.__errs.push(e.message + ' @ ' + e.filename + ':' + e.lineno);
        document.title = 'ERR#' + window.__errs.length;
      });
      window.addEventListener('unhandledrejection', (e) => {
        window.__errs.push('PROMISE:' + ((e.reason && e.reason.stack) || e.reason));
      });
    </script>
    <!-- 静态启动壳：加载门视觉（标题/进度条/失败重试/GPU 门）全内联在此——HTML 解析
         即上色，**先于一切 JS 下载执行**（白屏根治：旧 AssetLoadingScreen 是 Vue 组件，
         要等 2.4MB 关键 JS 到齐才第一次上色）。Vue 侧只留 assetsReady 状态机，进度经
         window.__bootShell 推入；观战页 watch.html 有同款壳（改视觉要两处同步）。 -->
    <style>
      /* UI_LANGUAGE.md：纯黑底 + 粗黑斜体标题 + 粗粝进度条 + 瑞米涂鸦（右下角）。
         字体栈：WDCHBoot（内联启动子集，零请求）→ WenDaoChaoHei（游戏子集，到了即换，
         同族无感）→ 系统黑体兜底。文道潮黑本体即粗，不再叠合成粗体。 */
      #boot-shell {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        background: #000000;
        font-family: 'WDCHBoot', 'WenDaoChaoHei', 'Microsoft YaHei', Arial, sans-serif;
        transition: opacity .3s ease;
      }
      #boot-shell.bye { opacity: 0; pointer-events: none; }
      #boot-title {
        font-size: 24px; color: #f2f2f2; letter-spacing: 2px;
        transform: skewX(-8deg);  /* 标题 8° 合成倾斜（概念图签名） */
      }
      /* 粗粝进度条：外层平铺粗粝纹理成 3px 框，内盖黑底，填充同款纹理（右缘飞白即毛边） */
      #boot-bar {
        width: min(440px, 62%); padding: 3px;
        background: url('./ui/grit256.png'); background-size: 256px 256px;
      }
      #boot-bar-in { background: #000000; }
      #boot-fill {
        height: 9px; width: 0%;
        background: url('./ui/grit256.png'); background-size: 256px 256px;
        transition: width .15s ease;
      }
      #boot-pct { font-size: 13px; color: #f2f2f2; min-height: 17px; }
      #boot-text { font-size: 11px; color: #c2c2c2; letter-spacing: .5px; }
      #boot-sub { font-size: 10px; color: #8a8a8a; min-height: 14px; letter-spacing: .5px; }
      #boot-fail { display: none; flex-direction: column; align-items: center; gap: 10px; margin-top: 6px; }
      #boot-fail-text { font-size: 11px; color: #ff8f88; text-align: center; line-height: 1.7; }
      /* 方角厚边 + 粗粝填充（亮底）→ 文字必须黑；一般按钮反馈 = 压暗 */
      #boot-retry {
        padding: 4px 18px; font-size: 12px; cursor: pointer;
        color: #000000; border: 2px solid #f2f2f2;
        background: url('./ui/grit256.png'); background-size: 256px 256px;
        font-family: inherit;
      }
      #boot-retry:hover { filter: brightness(0.72); }
      /* 瑞米涂鸦：右下角 sprite 序列帧（steps 逐帧跳；remi_loader.png = 12 帧 × 340×197，
         由 tools/buildRemiSprite.py 生成，帧数/尺寸改动要同步这里） */
      #boot-remi {
        position: absolute; right: 16px; bottom: 12px;
        width: 105px; height: 61px; overflow: hidden; pointer-events: none;
      }
      #boot-remi > div {
        width: 1260px; height: 61px;
        background: url('./ui/remi_loader.png') left top / 1260px 61px no-repeat;
        animation: remi-walk 1s steps(12) infinite;
      }
      @keyframes remi-walk { to { transform: translateX(-1260px); } }
    </style>
  </head>
  <body>
    <div id="boot-shell" role="status" aria-label="资源加载中">
      <div id="boot-title">魏启尖塔</div>
      <div id="boot-bar"><div id="boot-bar-in"><div id="boot-fill"></div></div></div>
      <div id="boot-pct"></div>
      <div id="boot-text">资源下载中</div>
      <div id="boot-sub"></div>
      <div id="boot-fail">
        <div id="boot-fail-text"></div>
        <button id="boot-retry" type="button">重试</button>
      </div>
      <div id="boot-remi"><div></div></div>
    </div>
    <div id="app"></div>
    <script>
      // 壳控制器：进度字节优先（HEAD 探测缺席退化为按张数）、失败重试、GPU 门、揭幕退场。
      // 与 App.vue 的契约：__bootShell.progress/failed/fatal/dismiss + __bootRetry 回调位。
      (function () {
        var $ = function (id) { return document.getElementById(id); };
        var shell = $('boot-shell'), fill = $('boot-fill'), text = $('boot-text'),
            sub = $('boot-sub'), failBox = $('boot-fail'), failText = $('boot-fail-text'),
            retryBtn = $('boot-retry'), pctEl = $('boot-pct');
        var dismissed = false;
        var fmtB = function (n) {
          if (!n || n < 0) return '—';
          if (n < 1024) return n + ' B';
          if (n < 1048576) return (n / 1024).toFixed(0) + ' KB';
          return (n / 1048576).toFixed(1) + ' MB';
        };
        // 60s 零进度提示（JS/网络双卡死时壳不至于干等成哑巴；不判死——慢网仍可能活）
        setTimeout(function () {
          if (!dismissed && shell.isConnected && fill.style.width === '0%') {
            sub.textContent = '网络较慢或加载异常——可稍候或刷新重试';
          }
        }, 60000);
        window.__bootShell = {
          // p = { loaded, total, loadedBytes, totalBytes, elapsedMs }（字节缺席自动退化按张数）
          progress: function (p) {
            if (dismissed || !p) return;
            var loaded = p.loaded || 0, total = p.total || 0;
            var pct = 0;
            if (total > 0 && loaded >= total) pct = 100;
            else if (p.totalBytes > 0) pct = Math.min(100, Math.round((p.loadedBytes || 0) / p.totalBytes * 100));
            else if (total > 0) pct = Math.round(loaded / total * 100);
            fill.style.width = pct + '%';
            pctEl.textContent = pct + '%';
            // 张数计数不显示（对玩家无信息量）；字节数/网速/ETA 保留
            var line = '资源下载中';
            if (p.totalBytes > 0) line += ' ' + fmtB(p.loadedBytes) + ' / ' + fmtB(p.totalBytes);
            text.textContent = line;
            var bits = [];
            if (p.loadedBytes > 0 && p.elapsedMs > 300) {
              var bps = p.loadedBytes / (p.elapsedMs / 1000);
              bits.push(bps < 1048576 ? (bps / 1024).toFixed(0) + ' KB/s' : (bps / 1048576).toFixed(1) + ' MB/s');
              var speed = p.loadedBytes / p.elapsedMs;
              var ms = speed > 0 ? (p.totalBytes - p.loadedBytes) / speed : 0;
              if (ms > 0) {
                var s = Math.round(ms / 1000);
                bits.push('剩余 ' + (s < 60 ? '约 ' + s + ' 秒' : '约 ' + Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒'));
              }
            }
            sub.textContent = bits.join(' ｜ ');
          },
          // 资源加载失败 N 项：卡住不放行（带缺图进游戏 = 白屏跑），给重试
          failed: function (n) {
            if (dismissed) return;
            failText.textContent = '资源加载失败 ' + n + ' 项——请检查网络后重试';
            retryBtn.style.display = '';
            failBox.style.display = 'flex';
          },
          // GPU 门（WebGPU 缺席 = 硬件不支持或非安全上下文）：无重试，卡死给引导
          fatal: function (html) {
            if (dismissed) return;
            $('boot-bar').style.display = 'none';
            pctEl.style.display = 'none';
            text.style.display = 'none';
            sub.style.display = 'none';
            retryBtn.style.display = 'none';
            failText.innerHTML = html;
            failText.style.color = '#c2c2c2';
            failBox.style.display = 'flex';
          },
          // 揭幕：淡出后摘除（App 的开始界面上位）
          dismiss: function () {
            if (dismissed) return;
            dismissed = true;
            fill.style.width = '100%';
            pctEl.textContent = '100%';
            shell.classList.add('bye');
            setTimeout(function () { shell.parentNode && shell.parentNode.removeChild(shell); }, 350);
          },
        };
        retryBtn.addEventListener('click', function () {
          failBox.style.display = 'none';
          if (typeof window.__bootRetry === 'function') window.__bootRetry();
        });
      })();
    </script>
    <script type="module" src="/src/shell/main.js"></script>
  </body>
</html>
